# Туман API на сервере хакатона. Запуск из корня репозитория:
#   cp deploy/.env.example deploy/.env   # заполнить
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  api:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    volumes: [tuman-data:/data]
    expose: ["8787"]

  # HTTPS-прокси: сертификат Let's Encrypt выдаётся автоматически на DOMAIN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tuman-data:
  caddy-data:
  caddy-config:
